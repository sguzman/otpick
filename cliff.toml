# git-cliff configuration for maintained post-MVP release history.

[changelog]
header = """
# Changelog

All maintained releases from v1.0.0 onward are recorded here.
"""

body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}

{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{%- for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- if commit.breaking and commit.breaking_description %}
  - **BREAKING:** {{ commit.breaking_description | trim }}
{%- endif %}
{%- endfor %}
{%- endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9].*"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^deps", group = "Dependencies" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Internal" },
  { message = "^test", group = "Internal" },
  { message = "^build", group = "Internal" },
  { message = "^ci", group = "Internal" },
  { message = "^style", group = "Internal" },
  { message = "^chore", group = "Internal" },
]
