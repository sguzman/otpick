name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release
      - name: Release binary size
        run: |
          bytes="$(stat -c '%s' target/release/otpick)"
          mib="$(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }")"
          echo "otpick release binary: $bytes bytes ($mib MiB)"
