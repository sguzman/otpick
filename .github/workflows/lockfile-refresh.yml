name: Refresh Cargo lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(lockfile): regenerate'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(lockfile): sync generated dependency graph"
          git push origin HEAD:main
